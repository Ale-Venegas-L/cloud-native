<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Computador</title>
    <style>
        form { max-width: 400px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 20px; background-color: #4CAF50; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background-color: #45a049; }
        a { display: inline-block; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Crear Computador</h1>
    <form method="POST">
        <div class="form-group">
            <label>Nombre:</label>
            <input type="text" name="nombre" required>
        </div>
        <div class="form-group">
            <label>CPU:</label>
            <input type="text" name="cpu" required>
        </div>
        <div class="form-group">
            <label>RAM (GB):</label>
            <input type="number" name="ram" required min="1">
        </div>
        <div class="form-group">
            <label>Marca:</label>
            <input type="text" name="marca" required>
        </div>
        <div class="form-group">
            <label>Tipo de Almacenamiento:</label>
            <select name="tipo_almacenamiento" required onchange="toggleStorageFields()">
                <option value="SSD">SSD</option>
                <option value="HDD">HDD</option>
                <option value="HIBRIDO">Híbrido</option>
            </select>
        </div>
        <div class="form-group" id="ssd-field">
            <label>Capacidad SSD (GB):</label>
            <input type="number" name="capacidad_ssd" value="0" min="0">
        </div>
        <div class="form-group" id="hdd-field">
            <label>Capacidad HDD (GB):</label>
            <input type="number" name="capacidad_hdd" value="0" min="0">
        </div>
        <button type="submit">Guardar</button>
    </form>
    <a href="{{ url_for('main.index') }}">← Volver</a>

    <script>
        function toggleStorageFields() {
            const tipo = document.querySelector('select[name="tipo_almacenamiento"]').value;
            document.getElementById('ssd-field').style.display = (tipo === 'SSD' || tipo === 'HIBRIDO') ? 'block' : 'none';
            document.getElementById('hdd-field').style.display = (tipo === 'HDD' || tipo === 'HIBRIDO') ? 'block' : 'none';
        }
        toggleStorageFields();
    </script>
</body>
</html>
